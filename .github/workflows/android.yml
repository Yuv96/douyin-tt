name: 抖音抬头版 · Android checks
on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build signed APK artifacts and run full API21 regression without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android5-player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check source, synthetic packaging fixtures and signing guards without compiling an APK
        run: python3 -B -m unittest discover -s android/tests -p 'test_*.py' -v
      - name: Verify bounded video ranges, playback gating and MP4 sample windows
        run: |
          mkdir -p "$RUNNER_TEMP/video-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/video-tests" android/src/com/dycomment/tv/Mp4Window.java android/src/com/dycomment/tv/BoundedVideoSource.java android/tests/jvm/com/dycomment/tv/*.java
          java -cp "$RUNNER_TEMP/video-tests" com.dycomment.tv.Mp4WindowTest
          java -cp "$RUNNER_TEMP/video-tests" com.dycomment.tv.BoundedVideoSourceTest
  build-test:
    if: inputs.build_apk == true
    needs: source-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android tools and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID5_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID5_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Original signing key is required for APK artifacts'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Original signing password is required for APK artifacts'; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python3 -m pip install 'CairoSVG==2.8.2' 'Pillow==11.3.0'
          python3 -m pip install -r companion/requirements-sync.txt
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android5.p12"
            echo "ANDROID5_KEYSTORE=$RUNNER_TEMP/android5.p12" >> "$GITHUB_ENV"
            chmod 600 "$RUNNER_TEMP/android5.p12"
          fi
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            delimiter="SIGNING_PASSWORD_$(openssl rand -hex 16)"
            {
              echo "ANDROID5_KEYSTORE_PASSWORD<<$delimiter"
              printf '%s\n' "$KEYSTORE_PASSWORD"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          fi
      - name: Compile API-21 regression build
        run: SELF_TEST=1 python3 android/build.py
      - name: Verify current regression APK against the pinned original signing certificate
        run: python3 -B android/signing.py dist-test/douyin-tt-0.1.5.apk
      - name: Verify manifest and packaged architectures
        run: |
          mkdir -p evidence
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist-test/*.apk > evidence/apk-info.txt
          grep "sdkVersion:'21'" evidence/apk-info.txt
          grep "native-code:.*x86" evidence/apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 21 dist-test/*.apk > evidence/signature.txt
          python3 android/verify_branding.py dist-test/douyin-tt-0.1.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android5-branding-preview
          path: android/build/branding-preview/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          disk-size: 4096M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -skin 1280x720 -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android5-player-evidence
          path: evidence/
      - name: Build production APK without test pages or fixtures
        run: python3 android/build.py
      - name: Verify production package
        run: python3 android/verify_apk.py
      - name: Verify current regression-to-production data-preserving installation on API 21
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          disk-size: 4096M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -skin 1280x720 -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android/upgrade_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android5-upgrade-evidence
          path: evidence/upgrade*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android5-player-apk
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: android5-armv7-apk
          path: dist/*-armv7.apk
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android5.p12"
