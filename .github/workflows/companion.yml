name: douyin-tt · Companion checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated fixture tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r companion/requirements-sync.txt
          python -B -m unittest discover -s companion/tests -p 'test_*.py' -v
